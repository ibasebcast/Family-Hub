name: Validate Family Hub

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Validate JSON metadata
        run: |
          python -m json.tool custom_components/family_hub/manifest.json > /dev/null
          python -m json.tool hacs.json > /dev/null
      - name: Run unit tests
        run: python -m pytest -q
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Lovelace JavaScript syntax
        run: |
          for file in custom_components/family_hub/www/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
