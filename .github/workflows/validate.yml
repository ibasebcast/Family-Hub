name: Validate Family Hub

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    name: Audit every tracked file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check all tracked files and cross-file references
        run: python scripts/audit_repository.py
      - name: Validate YAML, TOML, and JSON
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import json
          import subprocess
          import tomllib
          from pathlib import Path
          import yaml
          files = [Path(p) for p in subprocess.check_output(["git", "ls-files"]).decode().splitlines()]
          for path in files:
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              elif path.suffix == ".toml":
                  tomllib.loads(path.read_text(encoding="utf-8"))
              elif path.suffix in (".yaml", ".yml"):
                  with path.open(encoding="utf-8") as stream:
                      yaml.safe_load(stream)
              print("Validated", path)
          PY
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile every Python module
        run: python -m compileall -q custom_components tests scripts
      - name: Run all unit tests
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse every JavaScript file
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              node --check "$file"
            done
