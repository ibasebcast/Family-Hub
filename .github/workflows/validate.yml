name: Validate Family Hub

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest voluptuous homeassistant
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Validate JSON metadata
        run: python -m json.tool custom_components/family_hub/manifest.json > /dev/null && python -m json.tool hacs.json > /dev/null
      - name: Run tests
        run: python -m pytest -q
